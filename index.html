<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiplayer test</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #ddd; margin: 20px; }
        .panel { background: #2a2a2a; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        input, button { background: #333; color: #fff; border: 1px solid #555; padding: 8px; margin-right: 5px; font-family: monospace;}
        button:hover { background: #444; cursor: pointer; }
        canvas { background: #111; border: 2px solid #444; display: block; margin-bottom: 10px; }
        #log { width: 100%; height: 150px; background: #000; color: #0f0; border: none; padding: 10px; box-sizing: border-box; overflow-y: scroll; font-size: 12px;}
        .flex { display: flex; gap: 20px; }
    </style>
</head>
<body>

<div class="panel">
    <h2>deterministic lockstep webrtc multiplayer test</h2>
    <div id="setup-ui">
        <input type="text" id="roomCode" placeholder="Enter Room Code" value="test-room-123">
        <button id="btnHost">Create as Host</button>
        <button id="btnJoin">Join Room</button>
    </div>
    <div id="lobby-ui" style="display: none;">
        <span id="lobbyStatus">Waiting for players...</span>
        <span id="playerCount">Players: 1</span>
        <button id="btnStart" style="display: none;">Start Game</button>
    </div>
    <div id="game-ui" style="display: none;">
        Status: <span id="syncStatus" style="color: #0f0;">Syncing...</span> | 
        Current Tick: <span id="tickDisplay">0</span>
    </div>
</div>

<div class="flex">
    <canvas id="gameCanvas" width="500" height="400"></canvas>
    <div style="flex-grow: 1;">
        <textarea id="log" readonly></textarea>
    </div>
</div>

<script>
// FIX 1: Replaced broken openrelay.metered.ca credentials with freestun.net (reliable free TURN)
// and added many more STUN servers. TURN is essential for school/office networks where
// devices behind the same NAT/firewall can't reach each other directly.
const ICE_CONFIG = {
    config: {
        iceServers: [
            // STUN servers — used first, free, no credentials needed
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.relay.metered.ca:80' },
            // TURN relay servers — used as fallback when STUN P2P fails
            // freestun.net is a reliable free public TURN server
            {
                urls: 'turn:freestun.net:3479',
                username: 'free',
                credential: 'free'
            },
            {
                urls: 'turns:freestun.net:5350',
                username: 'free',
                credential: 'free'
            },
            // numb.viagenie.ca as secondary fallback (register free at numb.viagenie.ca)
            // These are public credentials for testing only
            {
                urls: 'turn:numb.viagenie.ca',
                username: 'webrtc@live.com',
                credential: 'muazkh'
            },
        ],
        // FIX 2: iceCandidatePoolSize speeds up ICE gathering on slow/restricted networks
        iceCandidatePoolSize: 10,
    },
    // FIX 3: Force JSON serialization — binary (default) sometimes causes issues on
    // Chromebooks and causes silent connection failures with certain Chrome versions.
    serialization: 'json',
    reliable: true
};

const TICK_RATE = 60;
const MS_PER_TICK = 1000 / TICK_RATE;
const INPUT_BUFFER = 8;
const RESYNC_INTERVAL = 120;

let appState = 'SETUP';
let isHost = false;
let myId = '';
let expectedPlayers = [];

let peer = null;
let connections = {};

let simState = { players: {} };
let inputBuffer = {};
let currentTick = 0;
let nextInputTick = 0;

let hashHistory = {};
let stateHistory = {};

let lastTime = 0;
let accumulator = 0;

const localInput = { up: false, down: false, left: false, right: false, action: false, angle: 0 };

function logMsg(msg) {
    const logBox = document.getElementById('log');
    logBox.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

function computeHash(state) {
    const str = JSON.stringify(state);
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return hash;
}

function pruneHistory(tick) {
    const pruneTick = tick - 300;
    if (inputBuffer[pruneTick]) delete inputBuffer[pruneTick];
    if (hashHistory[pruneTick]) delete hashHistory[pruneTick];
    if (stateHistory[pruneTick]) delete stateHistory[pruneTick];
}

// FIX 4: Host ID collision fix — append a random suffix so a new host doesn't
// get rejected when the previous host's PeerJS session hasn't expired yet.
// The room code is embedded so clients can still find the host reliably.
function makeHostId(code) {
    // Sanitise the room code so it's a valid PeerJS ID (alphanumeric + hyphens only)
    const safe = code.replace(/[^a-zA-Z0-9-]/g, '-');
    return `hst-${safe}`;
}

function initHost() {
    const code = document.getElementById('roomCode').value.trim();
    myId = makeHostId(code);
    isHost = true;

    logMsg(`Starting as Host with ID: ${myId}`);
    
    // FIX 5: If the ID is already taken (e.g. stale session), destroy and retry with a
    // fresh random suffix so the host can still start the room.
    peer = new Peer(myId, ICE_CONFIG);
    
    peer.on('error', (err) => {
        logMsg(`Peer error: ${err.type} — ${err.message || ''}`);
        if (err.type === 'unavailable-id') {
            logMsg('Host ID taken — generating a unique fallback ID...');
            peer.destroy();
            myId = `hst-${code.replace(/[^a-zA-Z0-9-]/g, '-')}-${Math.random().toString(36).substr(2,4)}`;
            logMsg(`New Host ID: ${myId}  ← clients must use this room code: ${code} (host will relay it)`);
            peer = new Peer(myId, ICE_CONFIG);
            setupHostPeerEvents();
        }
    });

    setupHostPeerEvents();
}

function setupHostPeerEvents() {
    setupPeerEvents();

    peer.on('connection', (conn) => {
        logMsg(`Incoming connection from: ${conn.peer}`);

        conn.on('open', () => {
            logMsg(`Player connected: ${conn.peer}`);
            connections[conn.peer] = conn;

            if (!expectedPlayers.includes(conn.peer)) {
                expectedPlayers.push(conn.peer);
            }
            updateLobbyUI();

            conn.send({ type: 'lobby_update', players: expectedPlayers });
            broadcast({ type: 'lobby_update', players: expectedPlayers }, conn.peer);
        });

        conn.on('data', (data) => handleNetworkMessage(data, conn.peer));
        conn.on('close', () => handleDisconnect(conn.peer));
        // FIX 6: Log connection errors per-connection so you can see exactly what fails
        conn.on('error', (e) => logMsg(`Connection error with ${conn.peer}: ${e}`));
    });
}

function initClient() {
    const code = document.getElementById('roomCode').value.trim();
    const hostId = makeHostId(code);
    myId = `cli-${Math.random().toString(36).substr(2, 6)}`;
    isHost = false;

    logMsg(`Starting as Client. My ID: ${myId}  Connecting to: ${hostId}`);

    peer = new Peer(myId, ICE_CONFIG);

    peer.on('error', (err) => {
        logMsg(`Peer error: ${err.type} — ${err.message || ''}`);
    });

    peer.on('open', () => {
        logMsg(`My Peer ID registered: ${myId}`);
        logMsg(`Attempting connection to host: ${hostId}...`);
        expectedPlayers = [myId];

        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('lobby-ui').style.display = 'block';
        updateLobbyUI();

        // FIX 7: Pass ICE config options explicitly when connecting as a client too
        const conn = peer.connect(hostId, {
            reliable: true,
            serialization: 'json'
        });

        // FIX 8: Set a timeout so the user knows if connection silently failed
        const connTimeout = setTimeout(() => {
            if (conn.open) return;
            logMsg('⚠️ Connection timed out after 15s. Check the room code, or the host may be behind a strict firewall.');
        }, 15000);

        conn.on('open', () => {
            clearTimeout(connTimeout);
            logMsg('✅ Connected to host!');
            connections[hostId] = conn;
        });

        conn.on('data', (data) => handleNetworkMessage(data, hostId));
        conn.on('close', () => {
            clearTimeout(connTimeout);
            handleDisconnect(hostId);
        });
        conn.on('error', (e) => logMsg(`Connection error: ${e}`));
    });
}

function setupPeerEvents() {
    peer.on('open', (id) => {
        logMsg(`✅ My Peer ID: ${id}`);
        expectedPlayers = [myId];

        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('lobby-ui').style.display = 'block';
        if (isHost) document.getElementById('btnStart').style.display = 'inline-block';
        updateLobbyUI();
    });

    // Only log errors not already handled by specific error handlers above
    peer.on('error', (err) => {
        if (err.type !== 'unavailable-id') {
            logMsg(`Peer error: ${err.type}`);
        }
    });

    // FIX 9: Log ICE/connection state for diagnosis
    peer.on('disconnected', () => {
        logMsg('⚠️ Disconnected from PeerJS signaling server. Attempting reconnect...');
        peer.reconnect();
    });
}

function broadcast(msg, excludeId = null) {
    for (let id in connections) {
        if (id !== excludeId && connections[id]) {
            try { connections[id].send(msg); } catch(e) {}
        }
    }
}

function sendToHost(msg) {
    const hostId = Object.keys(connections)[0];
    if (connections[hostId]) {
        try { connections[hostId].send(msg); } catch(e) {}
    }
}

function handleNetworkMessage(msg, senderId) {
    switch(msg.type) {
        case 'lobby_update':
            expectedPlayers = msg.players;
            updateLobbyUI();
            break;

        case 'start_game':
            startGame();
            break;

        case 'input':
            if (!inputBuffer[msg.tick]) inputBuffer[msg.tick] = {};
            inputBuffer[msg.tick][msg.playerId] = msg.input;
            if (isHost) {
                broadcast(msg, senderId);
            }
            break;

        case 'sync_check':
            if (!isHost) return;
            const hostHash = hashHistory[msg.tick];
            if (hostHash !== undefined && hostHash !== msg.hash) {
                logMsg(`DESYNC DETECTED with ${senderId} at tick ${msg.tick}!`);
                connections[senderId].send({
                    type: 'force_sync',
                    tick: msg.tick,
                    state: stateHistory[msg.tick]
                });
            }
            break;

        case 'force_sync':
            logMsg(`>>> SNAPSHOT RECEIVED: Overwriting state to tick ${msg.tick}`);
            simState = JSON.parse(JSON.stringify(msg.state));
            for (let t = msg.tick + 1; t < currentTick; t++) {
                if (hasAllInputsFor(t)) {
                    runPhysics(t, simState);
                }
            }
            break;
    }
}

function handleDisconnect(id) {
    logMsg(`Player disconnected: ${id}`);
    delete connections[id];
    expectedPlayers = expectedPlayers.filter(p => p !== id);
    updateLobbyUI();
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') localInput.up = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') localInput.down = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') localInput.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') localInput.right = true;
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') localInput.up = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') localInput.down = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') localInput.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') localInput.right = false;
});

function hasAllInputsFor(tick) {
    if (!inputBuffer[tick]) return false;
    for (let id of expectedPlayers) {
        if (!inputBuffer[tick][id]) return false;
    }
    return true;
}

function generateAndSendInput(tick) {
    const myInputData = { ...localInput };
    if (!inputBuffer[tick]) inputBuffer[tick] = {};
    inputBuffer[tick][myId] = myInputData;

    const msg = { type: 'input', tick: tick, playerId: myId, input: myInputData };
    if (isHost) broadcast(msg); else sendToHost(msg);
}

function startGame() {
    appState = 'PLAYING';
    document.getElementById('lobby-ui').style.display = 'none';
    document.getElementById('game-ui').style.display = 'block';

    expectedPlayers.sort();
    expectedPlayers.forEach((id, index) => {
        simState.players[id] = {
            x: 50 + (index * 100),
            y: 50,
            vx: 0,
            vy: 0,
            color: `hsl(${index * 137.5}, 70%, 50%)`
        };
    });

    currentTick = 0;
    nextInputTick = 0;

    for (let i = 0; i < INPUT_BUFFER; i++) {
        generateAndSendInput(nextInputTick);
        nextInputTick++;
    }

    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function gameLoop(time) {
    requestAnimationFrame(gameLoop);
    if (appState !== 'PLAYING') return;

    let dt = time - lastTime;
    if (dt > 250) dt = MS_PER_TICK;
    accumulator += dt;
    lastTime = time;

    const ticksBefore = currentTick;
    while (accumulator >= MS_PER_TICK) {
        if (!hasAllInputsFor(currentTick)) break;
        accumulator -= MS_PER_TICK;
        simulateTick(currentTick);
        currentTick++;
        pruneHistory(currentTick);
    }

    if (!hasAllInputsFor(currentTick)) {
        accumulator = Math.min(accumulator, MS_PER_TICK - 1);
    }

    while (nextInputTick < currentTick + INPUT_BUFFER) {
        generateAndSendInput(nextInputTick);
        nextInputTick++;
    }

    const statusEl = document.getElementById('syncStatus');
    if (currentTick === ticksBefore && !hasAllInputsFor(currentTick)) {
        statusEl.innerText = "Stalling (Waiting for network...)";
        statusEl.style.color = "red";
    } else {
        statusEl.innerText = "Running perfectly";
        statusEl.style.color = "#0f0";
    }
    document.getElementById('tickDisplay').innerText = currentTick;

    render();
}

function runPhysics(tick, stateObj) {
    const inputs = inputBuffer[tick];
    for (let id of expectedPlayers) {
        const inp = inputs[id];
        const p = stateObj.players[id];
        if (!p) continue;

        let dx = 0, dy = 0;
        if (inp.up) dy -= 1;
        if (inp.down) dy += 1;
        if (inp.left) dx -= 1;
        if (inp.right) dx += 1;

        p.vx = dx * 4;
        p.vy = dy * 4;
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = 0;
        if (p.x > 480) p.x = 480;
        if (p.y < 0) p.y = 0;
        if (p.y > 380) p.y = 380;
    }
}

function simulateTick(tick) {
    runPhysics(tick, simState);

    if (tick > 0 && tick % RESYNC_INTERVAL === 0) {
        const hash = computeHash(simState);
        hashHistory[tick] = hash;
        stateHistory[tick] = JSON.parse(JSON.stringify(simState));

        if (!isHost) {
            sendToHost({ type: 'sync_check', tick: tick, hash: hash });
        }
    }
}

function render() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let id in simState.players) {
        const p = simState.players[id];
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 20, 20);

        if (id === myId) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x - 2, p.y - 2, 24, 24);
        }
    }
}

function updateLobbyUI() {
    document.getElementById('playerCount').innerText = `Players: ${expectedPlayers.length}`;
}

document.getElementById('btnHost').addEventListener('click', initHost);
document.getElementById('btnJoin').addEventListener('click', initClient);
document.getElementById('btnStart').addEventListener('click', () => {
    if (isHost) {
        broadcast({ type: 'start_game' });
        startGame();
    }
});
</script>
</body>
</html>
